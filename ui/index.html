<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindFlow</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1a1d21; --accent:#4f7cf7; --radius:12px; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .app { display:flex; flex-direction:column; height:100vh; padding:24px; gap:16px; }
  .card { background:var(--panel); border-radius:var(--radius); padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  h1 { font-size:22px; margin-bottom:8px; }
  .status { color:var(--accent); font-weight:600; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; margin-top:12px; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>MindFlow</h1>
    <p>Tauri 2 壳已就绪。ui/ 为静态前端（可直接换成 Vue/React 构建产物）。</p>
  </div>
  <div class="card">
    <p>后端连通性：<span class="status" id="status">未检测</span></p>
    <button onclick="ping()">检测 Rust 命令调用</button>
  </div>
</div>
<script>
async function ping() {
  const el = document.getElementById('status');
  try {
    const { invoke } = window.__TAURI__.core;
    const res = await invoke('ping');
    el.textContent = '正常（返回: ' + res + '）';
  } catch (e) {
    el.textContent = '调用失败：' + e;
  }
}
</script>
</body>
</html>
